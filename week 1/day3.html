<script>
    // ==================== DAY 3 SLIDES (13 total) ====================

        {

            subtitle: "Performing mathematical operations in Python",
            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-plus-circle"></i> Basic Operators</h3><p><span class="highlight">+</span> Addition: 5 + 3 = 8<br><span class="highlight">-</span> Subtraction: 10 - 4 = 6<br><span class="highlight">*</span> Multiplication: 6 * 7 = 42<br><span class="highlight">/</span> Division: 15 / 4 = 3.75 (always returns float)</p></div><div class="concept-box"><h3><i class="fas fa-percent"></i> Special Operators</h3><p><span class="highlight">//</span> Floor Division: 15 // 4 = 3<br><span class="highlight">%</span> Modulus: 17 % 5 = 2<br><span class="highlight">**</span> Exponentiation: 2 ** 3 = 8</p></div></div><div class="code-block"><pre>a, b = 15, 4<br>print(a + b)   # 19<br>print(a - b)   # 11<br>print(a * b)   # 60<br>print(a / b)   # 3.75<br>print(a // b)  # 3<br>print(a % b)   # 3<br>print(2 ** 3)  # 8</pre></div>`
        },
        {
            title: "<i class='fas fa-balance-scale'></i> Comparison Operators",
            subtitle: "Comparing values (returns True or False)",
            content: `<div class="two-column-split"><div class="concept-box"><h3><i class="fas fa-equals"></i> Equality & Inequality</h3><p><span class="highlight">==</span> equal to: 5 == 5 → True<br><span class="highlight">!=</span> not equal: 5 != 3 → True<br><span class="highlight">></span> greater than: 10 > 5 → True<br><span class="highlight">&lt;</span> less than: 3 &lt; 7 → True</p></div><div class="concept-box"><h3><i class="fas fa-greater-than"></i> Greater/Less or Equal</h3><p><span class="highlight">>=</span> greater or equal: 5 >= 5 → True<br><span class="highlight">&lt;=</span> less or equal: 4 &lt;= 3 → False</p></div></div><div class="code-block"><pre>score = 85<br>print(score > 90)   # False<br>print(score >= 85)  # True<br>print(score == 100) # False</pre></div>`
        },
        {
            title: "<i class='fas fa-gate'></i> Logical Operators",
            subtitle: "Combining conditions: and, or, not",
            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-and"></i> AND</h3><p>True and True → True<br>True and False → False</p></div><div class="concept-box"><h3><i class="fas fa-or"></i> OR</h3><p>True or False → True<br>False or False → False</p></div><div class="concept-box"><h3><i class="fas fa-not"></i> NOT</h3><p>not True → False<br>not False → True</p></div></div><div class="code-block"><pre>age, has_license = 25, True<br>can_drive = age >= 18 and has_license  # True<br>is_weekend, is_holiday = False, True<br>go_party = is_weekend or is_holiday   # True</pre></div>`
        },
        {
            title: "<i class='fas fa-search'></i> Membership Operators",
            subtitle: "Checking if something exists in a collection",
            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-check-circle"></i> in Operator</h3><p>Returns True if value exists in sequence</p><div class="code-block"><pre>print('a' in "hello")  # True<br>print('z' in "hello")  # False</pre></div></div><div class="concept-box"><h3><i class="fas fa-times-circle"></i> not in Operator</h3><p>Returns True if value does NOT exist</p><div class="code-block"><pre>print('x' not in "Python")  # True<br>print('P' not in "Python")  # False</pre></div></div></div><div class="insight-card"><i class="fas fa-lightbulb"></i> Useful for checking user input, validation, and searching.</div>`
        },
        {
            title: "<i class='fas fa-code-branch'></i> if Statement",
            subtitle: "Making decisions in code — the foundation of logic",
            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-diagram-project"></i> if Syntax</h3><div class="code-block"><pre>if condition:<br>    # runs if True<br>    print("Condition met!")</pre></div></div><div class="concept-box"><h3><i class="fas fa-exclamation-triangle"></i> Important Rules</h3><p>✅ Condition must be Boolean<br>✅ Colon (:) after condition<br>✅ Indentation REQUIRED (4 spaces)</p></div></div><div class="code-block"><pre>temperature = 30<br>if temperature > 25:<br>    print("It's a hot day!")<br>    print("Drink water!")</pre></div>`
        },
        {
            title: "<i class='fas fa-share-alt'></i> if-else Statement",
            subtitle: "Two-way decision making",
            content: `<div class="two-column-split"><div class="concept-box"><h3><i class="fas fa-code-branch"></i> if-else Syntax</h3><div class="code-block"><pre>if condition:<br>    # runs if True<br>else:<br>    # runs if False</pre></div></div><div class="concept-box"><h3><i class="fas fa-battery-full"></i> Real Example</h3><div class="code-block"><pre>age = 16<br>if age >= 18:<br>    print("Adult")<br>else:<br>    print("Minor")</pre></div></div></div>`
        },
        {
            title: "<i class='fas fa-layer-group'></i> elif (Multiple Conditions)",
            subtitle: "Checking many possibilities",
            content: `<div class="concept-box"><h3><i class="fas fa-chart-simple"></i> elif = else if</h3><div class="code-block"><pre>if condition1:<br>    # condition1 True<br>elif condition2:<br>    # condition1 False AND condition2 True<br>elif condition3:<br>    # previous False, condition3 True<br>else:<br>    # all False</pre></div></div><div class="code-block"><pre>score = 85<br>if score >= 90: grade = "A"<br>elif score >= 80: grade = "B"<br>elif score >= 70: grade = "C"<br>else: grade = "F"<br>print(f"Grade: {grade}")  # Grade: B</pre></div>`
        },
        {
            title: "<i class='fas fa-star'></i> Practical: Grading System",
            subtitle: "Build a complete grade calculator",
            content: `<div class="concept-box"><h3><i class="fas fa-tasks"></i> Grading System Requirements</h3><ul><li>✓ Ask for student's score (0-100)</li><li>✓ Validate input (between 0-100)</li><li>✓ Assign letter grade: A(90+), B(80-89), C(70-79), D(60-69), F(0-59)</li><li>✓ Display grade and feedback message</li></ul></div><div class="code-block"><pre>score = int(input("Enter score (0-100): "))<br><br>if score &lt; 0 or score &gt; 100:<br>    print("Invalid score!")<br>elif score >= 90: print("Grade: A - Excellent!")<br>elif score >= 80: print("Grade: B - Good job!")<br>elif score >= 70: print("Grade: C - Satisfactory")<br>elif score >= 60: print("Grade: D - Need improvement")<br>else: print("Grade: F - Failed")</pre></div>`
        },
        {
            title: "<i class='fas fa-university'></i> Practical: ATM Simulation",
            subtitle: "Banking logic with if-elif-else",
            content: `<div class="two-column-split"><div class="concept-box"><h3><i class="fas fa-money-bill-wave"></i> ATM Requirements</h3><ul><li>Start balance = $1000</li><li>1=Balance, 2=Withdraw, 3=Deposit, 4=Exit</li><li>Check sufficient funds for withdrawal</li></ul></div><div class="concept-box"><h3><i class="fas fa-code"></i> Starter Code</h3><div class="code-block"><pre>balance = 1000<br>choice = int(input("1.Balance 2.Withdraw 3.Deposit: "))<br><br>if choice == 1:<br>    print(f"Balance: \${balance}")<br>elif choice == 2:<br>    amount = float(input("Amount: "))<br>    if amount <= balance:<br>        balance -= amount<br>        print(f"New balance: \${balance}")<br>    else: print("Insufficient funds!")<br>elif choice == 3:<br>    amount = float(input("Deposit: "))<br>    balance += amount<br>    print(f"New balance: \${balance}")</pre></div></div></div>`
        },
        {
            title: "<i class='fas fa-code'></i> Nested Conditions & Ternary Operator",

            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-diagram-project"></i> Nested if</h3><div class="code-block"><pre>if age >= 18:<br>    if has_license:<br>        print("Can drive")<br>    else: print("Need license")<br>else: print("Too young")</pre></div></div><div class="concept-box"><h3><i class="fas fa-question"></i> Ternary Operator</h3><div class="code-block"><pre># value_if_true if condition else value_if_false<br>status = "Adult" if age >= 18 else "Minor"</pre></div></div></div>`
        },
        {
            title: "<i class='fas fa-chalkboard'></i> Common Pitfalls & Best Practices",
            subtitle: "Avoid these common mistakes",
            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-exclamation-triangle"></i> Common Mistakes</h3><ul><li>❌ Using = instead of == in conditions</li><li>❌ Forgetting the colon (:) after if/elif/else</li><li>❌ Inconsistent indentation</li><li>❌ Not converting input() from string</li></ul></div><div class="concept-box"><h3><i class="fas fa-check-circle"></i> Best Practices</h3><ul><li>✅ Use 4 spaces for indentation</li><li>✅ Keep conditions simple</li><li>✅ Validate user input first</li><li>✅ Use elif instead of nested ifs when possible</li></ul></div></div>`
        },
        {
            title: "<i class='fas fa-question-circle'></i> Knowledge Check",
            subtitle: "Test your understanding of operators and conditionals",
            content: `<div class="qa-section"><div class="qa-title"><i class="fas fa-question-circle"></i> Toggle Questions (click to reveal answers)</div><div id="qa-container"></div></div>`
        },
        {
            title: "<i class='fas fa-clipboard-list'></i> Assignment & Next Steps",
            subtitle: "What to complete before Week 2",
            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-check-double"></i> Complete These Tasks</h3><ul><li>✅ Build the Grading System with input validation</li><li>✅ Create the ATM Simulation with all 4 options</li><li>✅ Write a program that determines if a year is a leap year</li><li>✅ Create a simple calculator with if statements</li><li>✅ Write a number guessing game</li></ul></div><div class="concept-box"><h3><i class="fas fa-calendar-day"></i> Week 2 Preview</h3><p><strong>Week 2: Control Flow & Loops</strong><br>Day 4: while/for loops, range()<br>Day 5: break, continue, pass<br>Day 6: Error handling (try/except)</p></div></div><div class="insight-card"><i class="fas fa-graduation-cap"></i> "Mastering conditionals is the first step toward writing intelligent, decision-making programs!"</div>`
        }
    ];

    // Q&A Data
    const qaData = [
        { q: "What does the % operator do?", a: "The modulus operator (%) returns the remainder of division. Example: 17 % 5 = 2." },
        { q: "What's the difference between = and ==?", a: "= is assignment (x = 5). == is comparison (x == 5 returns True/False)." },
        { q: "What do logical operators AND, OR, NOT do?", a: "AND: both True → True. OR: at least one True → True. NOT: reverses Boolean value." },
        { q: "What is the syntax of an if-elif-else statement?", a: "if condition1: block1; elif condition2: block2; elif condition3: block3; else: block4" },
        { q: "Why is indentation important in Python?", a: "Indentation defines code blocks. Unlike other languages that use braces {}, Python uses indentation to group statements." },
        { q: "What does the 'in' operator do?", a: "Checks if a value exists in a sequence (string, list, tuple). Returns True if found." },
        { q: "How do you check if a number is even using modulus?", a: "number % 2 == 0 → True for even numbers, False for odd numbers." },
        { q: "What is a ternary operator?", a: "A one-line if-else: value_if_true if condition else value_if_false" },
        { q: "What happens if you forget the colon after an if statement?", a: "Python raises a SyntaxError. The colon is required to indicate the start of the indented block." },
        { q: "How do you combine multiple conditions?", a: "Using logical operators: and, or. Example: if age >= 18 and has_license: print('Can drive')" }
    ];

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    const dotsContainer = document.getElementById('dotsContainer');

    function renderQA() {
        const container = document.getElementById('qa-container');
        if (!container) return;
        container.innerHTML = '';
        qaData.forEach((item, idx) => {
            const qaDiv = document.createElement('div');
            qaDiv.className = 'qa-item';
            qaDiv.innerHTML = `
                <div class="qa-question" data-idx="${idx}">
                    <span><strong>${idx+1}.</strong> ${item.q}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="qa-answer" id="answer-${idx}">
                    <p>${item.a}</p>
                </div>
            `;
            container.appendChild(qaDiv);
        });
        document.querySelectorAll('.qa-question').forEach(question => {
            question.addEventListener('click', function() {
                const idx = this.getAttribute('data-idx');
                const answerDiv = document.getElementById(`answer-${idx}`);
                const icon = this.querySelector('i');
                if (answerDiv) {
                    answerDiv.classList.toggle('show');
                    if (icon) {
                        icon.style.transform = answerDiv.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
                    }
                }
            });
        });
    }

    function renderSlide(index) {
        const slide = slides[index];
        const html = `
            <div class="slide-card">
                <div class="slide-title">${slide.title}</div>
                <div class="slide-sub"><i class="fas fa-angle-right"></i> ${slide.subtitle}</div>
                <div class="slide-content">${slide.content}</div>
            </div>
        `;
        slideArea.innerHTML = html;
        
        if (index === 11) {
            renderQA();
        }
        
        counterText.innerHTML = `<i class="far fa-file-alt"></i> ${index+1} / ${totalSlides}`;
        if (prevBtn) prevBtn.disabled = (index === 0);
        if (nextBtn) nextBtn.disabled = (index === totalSlides-1);
        updateDots(index);
    }

    function updateDots(activeIndex) {
        if (!dotsContainer) return;
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === activeIndex) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        }
    }

    function nextSlide() { 
        if (currentIndex < totalSlides - 1) { 
            currentIndex++; 
            renderSlide(currentIndex); 
        } 
    }
    
    function prevSlide() { 
        if (currentIndex > 0) { 
            currentIndex--; 
            renderSlide(currentIndex); 
        } 
    }
    
    function handleKeyDown(e) {
        if (e.key === 'ArrowRight') { 
            e.preventDefault(); 
            nextSlide(); 
        } else if (e.key === 'ArrowLeft') { 
            e.preventDefault(); 
            prevSlide(); 
        }
    }

    if (prevBtn) prevBtn.addEventListener('click', prevSlide);
    if (nextBtn) nextBtn.addEventListener('click', nextSlide);
    window.addEventListener('keydown', handleKeyDown);
    
    renderSlide(0);
</script>
</body>
</html>
