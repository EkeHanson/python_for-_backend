_is_active = True

<span style="color:#f87171;"># 2nd_place = "bad"  (can't start with number)</span>

first_name = "Alice"

<span style="color:#fbbf24;">print</span>(full_name)  <span style="color:#86efac;"># Alice Smith</span>

<span style="color:#86efac;"># f-strings (Python 3.6+)</span>

<span style="color:#fbbf24;">print</span>(f<span style="color:#86efac;">"{first_name} is {age} years old"</span>)</pre></div>

                    </div>
                    <div class="concept-box"><h3><i class="fas fa-calendar-day"></i> Next Class Preview</h3>
                        <p>Day 3: <strong>Operators & Decision Making</strong> — Arithmetic, comparison, logical operators, and conditional statements (if/elif/else). We'll build a Grading System and ATM Simulation!</p>
                    </div>
                </div>
                <div class="insight-card"><i class="fas fa-graduation-cap"></i> "Variables are the foundation of programming — master them and everything else gets easier!"</div>
            `
        }
    ];

    // Q&A Data
    const qaData = [
        { q: "What is a variable in Python?", a: "A variable is a named container that stores a value in memory. Example: name = 'John' stores the string 'John'." },
        { q: "What are the four main data types in Python?", a: "String (str), Integer (int), Float (float), Boolean (bool)." },
        { q: "What is the difference between an integer and a float?", a: "Integer is a whole number (10, -5, 0). Float has decimal points (3.14, -0.5, 2.0)." },
        { q: "What does the input() function return?", a: "input() always returns a string, regardless of what the user types." },
        { q: "How do you convert a string to an integer?", a: "Use int() function: int('42') → 42. If the string can't be converted, it raises a ValueError." },
        { q: "What are valid variable names? Give examples.", a: "snake_case: user_age, is_logged_in, count_2024. Cannot start with a number or contain spaces/hyphens." },
        { q: "What is an f-string and how is it used?", a: "f-string (formatted string literal) lets you embed variables directly in strings: f'Hello {name}'." },
        { q: "What does type() function do?", a: "type() returns the data type of a value or variable, e.g., type(42) → <class 'int'>." },
        { q: "What are Boolean values?", a: "Only two values: True and False (capital T and F). Used for conditions and decision making." },
        { q: "How do you concatenate strings?", a: "Use the + operator: 'Hello' + ' ' + 'World' → 'Hello World'." }
    ];

    // Rendering logic
    let currentIndex = 0;
    const totalSlides = slides.length;
    const slideArea = document.getElementById('slideArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counterText = document.getElementById('counterText');
    const dotsContainer = document.getElementById('dotsContainer');

    function renderQA() {
        const container = document.getElementById('qa-container');
        if (!container) return;
        container.innerHTML = '';
        qaData.forEach((item, idx) => {
            const qaDiv = document.createElement('div');
            qaDiv.className = 'qa-item';
            qaDiv.innerHTML = `
                <div class="qa-question" data-idx="${idx}">
                    <span><strong>${idx+1}.</strong> ${item.q}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="qa-answer" id="answer-${idx}">
                    <p>${item.a}</p>
                </div>
            `;
            container.appendChild(qaDiv);
        });
        document.querySelectorAll('.qa-question').forEach(question => {
            question.addEventListener('click', function() {
                const idx = this.getAttribute('data-idx');
                const answerDiv = document.getElementById(`answer-${idx}`);
                const icon = this.querySelector('i');
                answerDiv.classList.toggle('show');
                icon.style.transform = answerDiv.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
            });
        });
    }

    function renderSlide(index) {
        const slide = slides[index];
        const html = `
            <div class="slide-card">
                <div class="slide-title">
                    ${slide.title}
                </div>
                <div class="slide-sub"><i class="fas fa-angle-right"></i> ${slide.subtitle}</div>
                <div class="slide-content">
                    ${slide.content}
                </div>
            </div>
        `;
        slideArea.innerHTML = html;
        if (index === 9) renderQA(); // Knowledge check is slide 9 (0-index)
        counterText.innerHTML = `<i class="far fa-file-alt"></i> ${index+1} / ${totalSlides}`;
        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index === totalSlides-1);
        updateDots(index);
    }

    function updateDots(activeIndex) {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === activeIndex) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        }
    }

    function nextSlide() { if (currentIndex < totalSlides - 1) { currentIndex++; renderSlide(currentIndex); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(currentIndex); } }
    function handleKeyDown(e) {
        if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    }

    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);
    window.addEventListener('keydown', handleKeyDown);
    renderSlide(0);
</script>
</body>
</html>
