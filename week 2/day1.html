    const slides = [
        {
            title: "<i class='fas fa-sync-alt'></i> What are Loops?",
            subtitle: "Repeating code without writing it twice",
            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-question-circle"></i> Why Loops?</h3><p>Loops let you execute a block of code <span class="highlight">multiple times</span> without repeating yourself.</p><p>Instead of writing 100 print() statements, write one loop.</p></div><div class="concept-box"><h3><i class="fas fa-code-branch"></i> Two Types in Python</h3><p><span class="highlight">while</span> loop — runs while a condition is True<br><span class="highlight">for</span> loop — iterates over a sequence (list, string, range)</p></div></div><div class="code-block"><pre><span style="color:#7aa9ff;"># Without a loop (bad)</span>
print("Item 1")
print("Item 2")
print("Item 3")
<span style="color:#7aa9ff;"># ... 97 more times? No!</span>

<span style="color:#7aa9ff;"># With a for loop (good)</span>
for i in range(1, 101):
    print(f"Item {i}")</pre></div><div class="insight-card"><i class="fas fa-lightbulb"></i> Loops are the foundation of automation — they let computers do the repetitive work.</div>`
        },
        {
            title: "<i class='fas fa-arrow-rotate-left'></i> The while Loop",
            subtitle: "Repeat while a condition is True",
            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-diagram-project"></i> while Syntax</h3><div class="code-block"><pre>while condition:
    # code to repeat
    # update condition</pre></div><p>Checks condition <span class="highlight">before</span> each iteration.</p></div><div class="concept-box"><h3><i class="fas fa-exclamation-triangle"></i> Infinite Loop Warning</h3><p>If condition never becomes False, the loop runs <span class="highlight">forever</span>!</p><p>Always ensure the condition will eventually be False.</p></div></div><div class="code-block"><pre><span style="color:#7aa9ff;"># Simple while loop</span>
count = 1
while count <= 5:
    print(f"Count: {count}")
    count += 1  <span style="color:#86efac;"># ← CRITICAL: update the condition!</span>

<span style="color:#7aa9ff;"># Output: Count: 1, Count: 2, ... Count: 5</span></pre></div><div class="insight-card"><i class="fas fa-exclamation-triangle"></i> <strong>Common bug:</strong> Forgetting to update the loop variable causes infinite loops! Press Ctrl+C to stop.</div>`
        },
        {
            title: "<i class='fas fa-list'></i> The for Loop",
            subtitle: "Iterate over sequences",
            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-diagram-project"></i> for Syntax</h3><div class="code-block"><pre>for variable in sequence:
    # code to repeat</pre></div><p>Automatically iterates through each item.</p></div><div class="concept-box"><h3><i class="fas fa-list-ul"></i> Iterable Types</h3><p>Strings: <span class="highlight">"Hello"</span><br>Lists: <span class="highlight">[1, 2, 3]</span><br>Tuples: <span class="highlight">(1, 2, 3)</span><br>range(): <span class="highlight">range(5)</span></p></div></div><div class="code-block"><pre><span style="color:#7aa9ff;"># For loop with a list</span>
fruits = ["apple", "banana", "cherry"]
for fruit in fruits:
    print(f"I like {fruit}")

<span style="color:#7aa9ff;"># For loop with a string</span>
for char in "Python":
    print(char)  <span style="color:#86efac;"># P, y, t, h, o, n</span></pre></div>`
        },
        {
            title: "<i class='fas fa-sliders-h'></i> The range() Function",
            subtitle: "Generate sequences of numbers",
            content: `<div class="two-column-split"><div class="concept-box"><h3><i class="fas fa-hashtag"></i> range(stop)</h3><div class="code-block"><pre>for i in range(5):
    print(i)
<span style="color:#86efac;"># 0, 1, 2, 3, 4</span></pre></div></div><div class="concept-box"><h3><i class="fas fa-arrows-alt-h"></i> range(start, stop, step)</h3><div class="code-block"><pre>for i in range(2, 10, 2):
    print(i)
<span style="color:#86efac;"># 2, 4, 6, 8</span></pre></div></div></div><div class="code-block"><pre><span style="color:#7aa9ff;"># range() variations</span>
range(5)        <span style="color:#86efac;"># 0, 1, 2, 3, 4</span>
range(1, 6)     <span style="color:#86efac;"># 1, 2, 3, 4, 5</span>
range(0, 10, 2) <span style="color:#86efac;"># 0, 2, 4, 6, 8</span>
range(5, 0, -1) <span style="color:#86efac;"># 5, 4, 3, 2, 1 (reverse!)</span></pre></div><div class="insight-card"><i class="fas fa-lightbulb"></i> range() is memory-efficient — it generates numbers on the fly, not storing them all at once.</div>`
        },
        {
            title: "<i class='fas fa-code-branch'></i> break Statement",
            subtitle: "Exit the loop immediately",
            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-stop-circle"></i> What break does</h3><p><span class="highlight">break</span> terminates the loop entirely, regardless of the condition.</p><p>Useful for: searching, early exit on error, finding first match.</p></div><div class="concept-box"><h3><i class="fas fa-search"></i> Common Use Case</h3><p>Searching through data and stopping when you find what you need.</p></div></div><div class="code-block"><pre><span style="color:#7aa9ff;"># Break example — find first even number</span>
numbers = [1, 3, 5, 7, 8, 9, 11]
for num in numbers:
    if num % 2 == 0:
        print(f"Found even: {num}")
        break  <span style="color:#86efac;"># Stop searching after finding 8</span>

<span style="color:#7aa9ff;"># While loop with break</span>
while True:
    user_input = input("Type 'quit' to exit: ")
    if user_input == "quit":
        print("Goodbye!")
        break</pre></div>`
        },
        {
            title: "<i class='fas fa-forward'></i> continue Statement",
            subtitle: "Skip the current iteration",
            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-skip-forward"></i> What continue does</h3><p><span class="highlight">continue</span> skips the rest of the current iteration and moves to the next one.</p><p>Useful for: filtering, skipping invalid data.</p></div><div class="concept-box"><h3><i class="fas fa-filter"></i> break vs continue</h3><p><span class="highlight">break</span> = exit the loop entirely<br><span class="highlight">continue</span> = skip to next iteration</p></div></div><div class="code-block"><pre><span style="color:#7aa9ff;"># Continue example — skip even numbers</span>
for i in range(1, 11):
    if i % 2 == 0:
        continue  <span style="color:#86efac;"># Skip even numbers</span>
    print(i)  <span style="color:#86efac;"># Only prints odd: 1, 3, 5, 7, 9</span>

<span style="color:#7aa9ff;"># Practical: skip empty strings</span>
names = ["Alice", "", "Bob", "", "Charlie"]
for name in names:
    if name == "":
        continue
    print(f"Hello, {name}!")</pre></div>`
        },
        {
            title: "<i class='fas fa-layer-group'></i> Nested Loops",

            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-diagram-project"></i> How Nested Loops Work</h3><p>For each iteration of the <span class="highlight">outer loop</span>, the <span class="highlight">inner loop</span> runs completely.</p><p>Total iterations = outer × inner</p></div><div class="concept-box"><h3><i class="fas fa-table"></i> Common Uses</h3><p>Multiplication tables<br>Grid/matrix operations<br>Comparing items in lists</p></div></div><div class="code-block"><pre><span style="color:#7aa9ff;"># Multiplication table (1 to 3)</span>
for i in range(1, 4):      <span style="color:#86efac;"># Outer loop</span>
    for j in range(1, 4):  <span style="color:#86efac;"># Inner loop</span>
        print(f"{i} × {j} = {i*j}")
    print("---")  <span style="color:#86efac;"># After each outer iteration</span>

<span style="color:#7aa9ff;"># Output:</span>
<span style="color:#86efac;"># 1 × 1 = 1, 1 × 2 = 2, 1 × 3 = 3, ---</span>
<span style="color:#86efac;"># 2 × 1 = 2, 2 × 2 = 4, 2 × 3 = 6, ---</span>
<span style="color:#86efac;"># 3 × 1 = 3, 3 × 2 = 6, 3 × 3 = 9, ---</span></pre></div>`
        },
        {
            title: "<i class='fas fa-code'></i> else with Loops",
            subtitle: "Execute code when loop completes normally",
            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-check-circle"></i> else Clause</h3><p>The <span class="highlight">else</span> block runs when the loop finishes <span class="highlight">without</span> hitting a break.</p><p>If break is triggered, else does NOT run.</p></div><div class="concept-box"><h3><i class="fas fa-search"></i> Practical Pattern</h3><p>Search for an item — if found, break. If not found, else runs.</p></div></div><div class="code-block"><pre><span style="color:#7aa9ff;"># For-else example</span>
numbers = [1, 3, 5, 7, 9]
for num in numbers:
    if num % 2 == 0:
        print(f"Found even: {num}")
        break
else:
    print("No even numbers found!")  <span style="color:#86efac;"># ← This runs!</span>

<span style="color:#7aa9ff;"># While-else example</span>
count = 1
while count <= 3:
    print(count)
    count += 1
else:
    print("Loop completed without break")</pre></div><div class="insight-card"><i class="fas fa-lightbulb"></i> The else clause is unique to Python — most languages don't have this feature!</div>`
        },
        {
            title: "<i class='fas fa-calculator'></i> Practical: Sum Calculator",
            subtitle: "Add numbers until user types 'done'",
            content: `<div class="concept-box"><h3><i class="fas fa-tasks"></i> Build a Sum Calculator</h3><ul><li>✓ Keep asking for numbers</li><li>✓ Add each number to a running total</li><li>✓ Type 'done' to exit and show total</li><li>✓ Handle invalid input gracefully</li></ul></div><div class="code-block"><pre><span style="color:#7aa9ff;"># Sum Calculator — using while loop</span>
total = 0
count = 0

while True:
    user_input = input("Enter a number (or 'done'): ")
    if user_input.lower() == 'done':
        break
    try:
        num = float(user_input)
        total += num
        count += 1
        print(f"Running total: {total}")
    except ValueError:
        print("Invalid input! Please enter a number.")

print(f"\nFinal total: {total}")
print(f"Numbers entered: {count}")
print(f"Average: {total / count if count > 0 else 0}")</pre></div><div class="insight-card"><i class="fas fa-star"></i> <strong>Challenge:</strong> Add a feature to show the minimum and maximum numbers entered.</div>`
        },
        {
            title: "<i class='fas fa-list-ol'></i> Practical: FizzBuzz",
            subtitle: "The classic coding interview problem",
            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-tasks"></i> FizzBuzz Rules</h3><p>Print numbers 1 to 100, but:</p><ul><li>If divisible by 3 → print "Fizz"</li><li>If divisible by 5 → print "Buzz"</li><li>If divisible by both → print "FizzBuzz"</li><li>Otherwise → print the number</li></ul></div><div class="concept-box"><h3><i class="fas fa-briefcase"></i> Why It Matters</h3><p>FizzBuzz is a common interview question to test basic programming logic. It combines loops, conditionals, and modulo.</p></div></div><div class="code-block"><pre><span style="color:#7aa9ff;"># FizzBuzz solution</span>
for num in range(1, 101):
    if num % 3 == 0 and num % 5 == 0:
        print("FizzBuzz")
    elif num % 3 == 0:
        print("Fizz")
    elif num % 5 == 0:
        print("Buzz")
    else:
        print(num)

<span style="color:#7aa9ff;"># Bonus: One-liner version</span>
<span style="color:#7aa9ff;"># for i in range(1,101): print("Fizz"*(i%3==0)+"Buzz"*(i%5==0) or i)</span></pre></div>`
        },
        {
            title: "<i class='fas fa-chart-line'></i> Loop Performance & Best Practices",
            subtitle: "Write efficient, readable loops",
            content: `<div class="two-column-split"><div class="concept-box"><h3><i class="fas fa-check-circle"></i> Best Practices</h3><ul><li>✅ Use for loops when iterating over sequences</li><li>✅ Use while loops when condition-based</li><li>✅ Keep loop bodies short and focused</li><li>✅ Use meaningful variable names</li><li>✅ Avoid modifying the iterable while looping</li></ul></div><div class="concept-box"><h3><i class="fas fa-exclamation-triangle"></i> Common Mistakes</h3><ul><li>❌ Infinite loops (forget to update condition)</li><li>❌ Off-by-one errors (range boundaries)</li><li>❌ Modifying list while iterating</li><li>❌ Using == instead of = in while condition</li></ul></div></div><div class="code-block"><pre><span style="color:#7aa9ff;"># ❌ Bad: modifying list while iterating</span>

for num in numbers:

<span style="color:#7aa9ff;"># ✅ Good: create a new list</span>

even_numbers = [num for num in numbers if num % 2 == 0]</pre></div>`

            subtitle: "Test your understanding of loops",

        },
        {
            title: "<i class='fas fa-clipboard-list'></i> Assignment & Next Steps",

            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-check-double"></i> Homework Tasks</h3><ul><li>✅ Build the Sum Calculator with input validation</li><li>✅ Complete FizzBuzz (1 to 100)</li><li>✅ Write a program that prints a multiplication table (1-10)</li><li>✅ Create a number guessing game (while loop)</li><li>✅ Write a loop that finds all prime numbers up to 100</li></ul></div><div class="concept-box"><h3><i class="fas fa-calendar-day"></i> Next Class Preview</h3><p><strong>Day 2: Lists & Dictionaries</strong><br>Creating, accessing, modifying lists and dictionaries. List methods, dictionary operations, and building a Contact Book app.</p></div></div><div class="insight-card"><i class="fas fa-graduation-cap"></i> "Loops turn a computer into a tireless worker — it never gets bored repeating tasks!"</div>`

    const qaData = [
        { q: "What is the difference between a while loop and a for loop?", a: "A while loop runs while a condition is True (condition-based). A for loop iterates over a sequence (item-based). Use for when you know what to iterate over, while when you're waiting for a condition." },
        { q: "What does the range() function do?", a: "range() generates a sequence of numbers. range(5) → 0,1,2,3,4. range(2,10,2) → 2,4,6,8. It's memory-efficient because it generates numbers on the fly." },
        { q: "What is the difference between break and continue?", a: "break exits the loop entirely. continue skips the current iteration and moves to the next one." },
        { q: "What happens if you forget to update the loop variable in a while loop?", a: "The condition never becomes False, creating an infinite loop. The program will run forever until you force-stop it (Ctrl+C)." },
        { q: "When does the else clause of a loop execute?", a: "The else clause runs when the loop completes normally (without hitting a break statement). If break is triggered, else does NOT run." },
        { q: "How do nested loops work?", a: "For each iteration of the outer loop, the inner loop runs completely. Total iterations = outer count × inner count." },
        { q: "What is FizzBuzz and why is it famous?", a: "FizzBuzz prints numbers 1-100, replacing multiples of 3 with 'Fizz', multiples of 5 with 'Buzz', and multiples of both with 'FizzBuzz'. It's a classic interview question to test basic programming logic." },
        { q: "What is an off-by-one error in loops?", a: "An off-by-one error occurs when a loop iterates one time too many or one time too few. Example: using range(5) when you meant range(1,6) to get 1-5." },
        { q: "Why should you avoid modifying a list while iterating over it?", a: "Modifying a list during iteration can cause unexpected behavior — items shift positions, some get skipped, and you might get IndexError. Create a new list instead." },
        { q: "What is the output of: for i in range(3): print(i)", a: "0, 1, 2. range(3) generates 0, 1, 2 (stops before 3)." }
    ];

    let currentIndex = 0;
    const totalSlides = slides.length;
    const slideArea = document.getElementById('slideArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counterText = document.getElementById('counterText');
    const dotsContainer = document.getElementById('dotsContainer');

    function renderQA() {
        const container = document.getElementById('qa-container');
        if (!container) return;
        container.innerHTML = '';
        qaData.forEach((item, idx) => {
            const qaDiv = document.createElement('div');
            qaDiv.className = 'qa-item';
            qaDiv.innerHTML = `
                <div class="qa-question" data-idx="${idx}">
                    <span><strong>${idx+1}.</strong> ${item.q}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="qa-answer" id="answer-${idx}">
                    <p>${item.a}</p>
                </div>
            `;
            container.appendChild(qaDiv);
        });
        document.querySelectorAll('.qa-question').forEach(question => {
            question.addEventListener('click', function() {
                const idx = this.getAttribute('data-idx');
                const answerDiv = document.getElementById(`answer-${idx}`);
                const icon = this.querySelector('i');
                if (answerDiv) {
                    answerDiv.classList.toggle('show');
                    if (icon) icon.style.transform = answerDiv.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
                }
            });
        });
    }

    function renderSlide(index) {
        const slide = slides[index];
        const html = `
            <div class="slide-card">
                <div class="slide-title">${slide.title}</div>
                <div class="slide-sub"><i class="fas fa-angle-right"></i> ${slide.subtitle}</div>
                <div class="slide-content">${slide.content}</div>
            </div>
        `;
        slideArea.innerHTML = html;
        if (index === 11) renderQA();
        counterText.innerHTML = `<i class="far fa-file-alt"></i> ${index+1} / ${totalSlides}`;
        if (prevBtn) prevBtn.disabled = (index === 0);
        if (nextBtn) nextBtn.disabled = (index === totalSlides-1);
        updateDots(index);
    }

    function updateDots(activeIndex) {
        if (!dotsContainer) return;
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === activeIndex) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        }
    }

    function nextSlide() { if (currentIndex < totalSlides - 1) { currentIndex++; renderSlide(currentIndex); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(currentIndex); } }
    function handleKeyDown(e) {
        if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    }

    if (prevBtn) prevBtn.addEventListener('click', prevSlide);
    if (nextBtn) nextBtn.addEventListener('click', nextSlide);
    window.addEventListener('keydown', handleKeyDown);
    renderSlide(0);
</script>
</body>
</html>
