<script>
    // ==================== JSON HANDLING SLIDES ====================
    const slides = [
        {
            title: "<i class='fas fa-brackets-curly'></i> What is JSON?",
            subtitle: "JavaScript Object Notation — the universal data format",
            content: `
                <div class="content-grid">
                    <div class="concept-box"><h3><i class="fas fa-globe"></i> Definition</h3><p>JSON is a lightweight, <span class="highlight">text-based</span> data interchange format. It's easy for humans to read and write, and easy for machines to parse and generate.</p></div>
                    <div class="concept-box"><h3><i class="fas fa-exchange-alt"></i> Why JSON?</h3><p>✓ APIs return JSON<br>✓ Config files (package.json, .eslintrc)<br>✓ Data storage (NoSQL, logs)<br>✓ Language-independent</p></div>
                </div>
                <div class="insight-card"><i class="fas fa-lightbulb"></i> JSON is a <span class="highlight">string format</span>. Python dictionaries are in-memory objects. They look similar but are not the same!</div>
            `
        },
        {
            title: "<i class='fas fa-code'></i> JSON Syntax & Data Types",
            subtitle: "Objects, arrays, strings, numbers, booleans, null",
            content: `
                <div class="two-column-split">
                    <div class="concept-box"><h3><i class="fas fa-file-code"></i> JSON Example</h3>
                        <div class="code-block"><pre>{
  <span style="color:#86efac;">"name"</span>: <span style="color:#86efac;">"Alice"</span>,
  <span style="color:#86efac;">"age"</span>: <span style="color:#fbbf24;">30</span>,
  <span style="color:#86efac;">"is_student"</span>: <span style="color:#fbbf24;">false</span>,
  <span style="color:#86efac;">"courses"</span>: [<span style="color:#86efac;">"Python"</span>, <span style="color:#86efac;">"SQL"</span>],
  <span style="color:#86efac;">"address"</span>: <span style="color:#fbbf24;">null</span>
}</pre></div>
                    </div>
                    <div class="concept-box"><h3><i class="fas fa-arrows-alt-h"></i> Type Mapping</h3>
                        <table style="width:100%; color:#e2e8f0; font-size:0.9rem; border-collapse: collapse;">
                            <tr style="border-bottom:1px solid #334155;"><th style="text-align:left; padding:0.3rem;">JSON</th><th style="text-align:left; padding:0.3rem;">Python</th></tr>
                            <tr><td style="padding:0.3rem;">object</td><td style="padding:0.3rem;">dict</td></tr>
                            <tr><td style="padding:0.3rem;">array</td><td style="padding:0.3rem;">list</td></tr>
                            <tr><td style="padding:0.3rem;">string</td><td style="padding:0.3rem;">str</td></tr>
                            <tr><td style="padding:0.3rem;">number</td><td style="padding:0.3rem;">int/float</td></tr>
                            <tr><td style="padding:0.3rem;">true/false</td><td style="padding:0.3rem;">True/False</td></tr>
                            <tr><td style="padding:0.3rem;">null</td><td style="padding:0.3rem;">None</td></tr>
                        </table>
                    </div>
                </div>
            `
        },
        {
            title: "<i class='fas fa-box-open'></i> The json Module",
            subtitle: "load, loads, dump, dumps — the four core functions",
            content: `
                <div class="mode-grid">
                    <div class="mode-card">
                        <div class="mode-letter">load</div>
                        <div class="mode-name">File → Python</div>
                        <div class="mode-desc">Reads JSON from a <strong>file object</strong> and returns a Python object.</div>
                    </div>
                    <div class="mode-card">
                        <div class="mode-letter">loads</div>
                        <div class="mode-name">String → Python</div>
                        <div class="mode-desc">Parses a JSON <strong>string</strong> and returns a Python object. (load + s = string)</div>
                    </div>
                    <div class="mode-card">
                        <div class="mode-letter">dump</div>
                        <div class="mode-name">Python → File</div>
                        <div class="mode-desc">Writes a Python object as JSON to a <strong>file object</strong>.</div>
                    </div>
                    <div class="mode-card">
                        <div class="mode-letter">dumps</div>
                        <div class="mode-name">Python → String</div>
                        <div class="mode-desc">Converts a Python object to a JSON <strong>string</strong>. (dump + s = string)</div>
                    </div>
                </div>
                <div class="insight-card"><i class="fas fa-brain"></i> <strong>Mnemonic:</strong> the <span class="highlight">'s'</span> stands for <strong>string</strong>. All other functions work with files.</div>
            `
        },
        {
            title: "<i class='fas fa-file-import'></i> Reading JSON from Files",
            subtitle: "json.load() and accessing nested data",
            content: `
                <div class="concept-box"><h3><i class="fas fa-code"></i> Basic Read</h3>
                    <div class="code-block"><pre><span style="color:#fbbf24;">import</span> json

<span style="color:#fbbf24;">with</span> open(<span style="color:#86efac;">"data.json"</span>) <span style="color:#fbbf24;">as</span> f:
    data = json.load(f)

<span style="color:#fbbf24;">print</span>(data[<span style="color:#86efac;">"name"</span>])       <span style="color:#7aa9ff;"># Alice</span>
<span style="color:#fbbf24;">print</span>(data[<span style="color:#86efac;">"courses"</span>][<span style="color:#fbbf24;">0</span>])  <span style="color:#7aa9ff;"># Python</span></pre></div>
                </div>
                <div class="warning-card"><i class="fas fa-exclamation-triangle"></i> Always open JSON files with default text mode <span class="highlight">"r"</span> (or specify encoding). Binary mode will break parsing.</div>
                <div class="insight-card"><i class="fas fa-nested"></i> Access nested values with chained brackets: <span class="highlight">data["users"][0]["email"]</span>. Use <span class="highlight">.get()</span> to avoid KeyError.</div>
            `
        },
        {
            title: "<i class='fas fa-file-export'></i> Writing JSON to Files",
            subtitle: "json.dump() with formatting options",
            content: `
                <div class="two-column-split">
                    <div class="concept-box"><h3><i class="fas fa-save"></i> Basic Write</h3>
                        <div class="code-block"><pre><span style="color:#fbbf24;">import</span> json

data = {<span style="color:#86efac;">"name"</span>: <span style="color:#86efac;">"Bob"</span>, <span style="color:#86efac;">"age"</span>: <span style="color:#fbbf24;">25</span>}

<span style="color:#fbbf24;">with</span> open(<span style="color:#86efac;">"output.json"</span>, <span style="color:#86efac;">"w"</span>) <span style="color:#fbbf24;">as</span> f:
    json.dump(data, f, indent=<span style="color:#fbbf24;">4</span>)</pre></div>
                    </div>
                    <div class="concept-box"><h3><i class="fas fa-magic"></i> Common Parameters</h3>
                        <ul style="color:#e2e8f0; padding-left:1.2rem;">
                            <li><span class="highlight">indent=4</span> — pretty print</li>
                            <li><span class="highlight">sort_keys=True</span> — alphabetical keys</li>
                            <li><span class="highlight">ensure_ascii=False</span> — keep unicode</li>
                        </ul>
                    </div>
                </div>
                <div class="insight-card"><i class="fas fa-lightbulb"></i> Use <span class="highlight">json.dumps(data, indent=2)</span> to get a pretty JSON string for printing or debugging.</div>
            `
        },
        {
            title: "<i class='fas fa-shield-alt'></i> Safe Access with .get()",
            subtitle: "Avoid KeyError — chain .get() for nested JSON",
            content: `
                <div class="two-column-split">
                    <div class="concept-box"><h3><i class="fas fa-times-circle"></i> The Risky Way (Brackets)</h3>
                        <div class="code-block"><pre>data = {
  <span style="color:#86efac;">"name"</span>: <span style="color:#86efac;">"Alice"</span>,
  <span style="color:#86efac;">"school"</span>: {<span style="color:#86efac;">"name"</span>: <span style="color:#86efac;">"RSU"</span>, <span style="color:#86efac;">"email"</span>: <span style="color:#86efac;">"info@rsu.edu.ng"</span>}
}

<span style="color:#7aa9ff;"># If "school" or "email" is missing → KeyError</span>
email = data[<span style="color:#86efac;">"school"</span>][<span style="color:#86efac;">"email"</span>]
<span style="color:#fbbf24;">print</span>(email)  <span style="color:#7aa9ff;"># info@rsu.edu.ng</span></pre></div>
                    </div>
                    <div class="concept-box"><h3><i class="fas fa-check-circle"></i> The Safe Way (.get())</h3>
                        <div class="code-block"><pre><span style="color:#7aa9ff;"># Chain .get() with {} fallback</span>
email = data.get(<span style="color:#86efac;">"school"</span>, {}).get(<span style="color:#86efac;">"email"</span>, <span style="color:#86efac;">"N/A"</span>)
<span style="color:#fbbf24;">print</span>(email)  <span style="color:#7aa9ff;"># info@rsu.edu.ng</span></pre></div>
                        <p style="font-size:0.85rem;">1. <span class="highlight">data.get("school", {})</span> → returns dict or <span class="highlight">{}</span><br>
                        2. <span class="highlight">.get("email", "N/A")</span> → returns email or fallback</p>
                    </div>
                </div>
                <div class="warning-card"><i class="fas fa-exclamation-triangle"></i> If the value could be <span class="highlight">None</span>, use <span class="highlight">data.get("school") or {}</span> — the <span class="highlight">or {}</span> converts any falsy value into an empty dict.</div>
                <div class="insight-card"><i class="fas fa-shield-alt"></i> <strong>Rule:</strong> If you're not 100% sure a key exists, use <span class="highlight">.get()</span>. This is the #1 habit that separates beginner code from production-ready code.</div>
            `
        },
        {
            title: "<i class='fas fa-magic'></i> Formatting JSON Output",
            subtitle: "indent, sort_keys, ensure_ascii — one example, all three",
            content: `
                <div class="concept-box"><h3><i class="fas fa-code"></i> The Example</h3>
                    <div class="code-block"><pre><span style="color:#fbbf24;">import</span> json

student = {
    <span style="color:#86efac;">"name"</span>: <span style="color:#86efac;">"Chidi"</span>,
    <span style="color:#86efac;">"age"</span>: <span style="color:#fbbf24;">22</span>,
    <span style="color:#86efac;">"city"</span>: <span style="color:#86efac;">"Lagos"</span>,
    <span style="color:#86efac;">"greeting"</span>: <span style="color:#86efac;">"Ẹ káàbọ̀"</span>,  <span style="color:#7aa9ff;"># Yoruba: Welcome</span>
    <span style="color:#86efac;">"course"</span>: <span style="color:#86efac;">"Python"</span>
}

<span style="color:#fbbf24;">with</span> open(<span style="color:#86efac;">"student.json"</span>, <span style="color:#86efac;">"w"</span>) <span style="color:#fbbf24;">as</span> f:
    json.dump(student, f, indent=<span style="color:#fbbf24;">4</span>, sort_keys=<span style="color:#fbbf24;">True</span>, ensure_ascii=<span style="color:#fbbf24;">False</span>)</pre></div>
                </div>
                <div class="two-column-split">
                    <div class="concept-box"><h3><i class="fas fa-file-code"></i> Output</h3>

    <span style="color:#86efac;">"age"</span>: <span style="color:#fbbf24;">22</span>,
    <span style="color:#86efac;">"city"</span>: <span style="color:#86efac;">"Lagos"</span>,

    // Q&A Data
    const qaData = [
        { q: "What does JSON stand for?", a: "JavaScript Object Notation — a lightweight text-based data interchange format." },
        { q: "What is the difference between json.load() and json.loads()?", a: "json.load() reads from a file object. json.loads() parses a JSON string. The 's' stands for string." },
        { q: "What is the difference between json.dump() and json.dumps()?", a: "json.dump() writes to a file object. json.dumps() returns a JSON string." },
        { q: "How do you pretty-print JSON when writing to a file?", a: "Use the indent parameter: json.dump(data, f, indent=4)." },
        { q: "What does sort_keys=True do?", a: "It sorts the keys of every dictionary in the output alphabetically, making the JSON predictable and easy to diff." },
        { q: "What does ensure_ascii=False do?", a: "It keeps non-ASCII characters (like Ẹ, é, ñ, 中文) as real characters instead of escaping them to \\uXXXX sequences." },
        { q: "How do you safely access a nested key that might not exist?", a: "Chain .get() with an empty dict fallback: data.get('school', {}).get('email', 'N/A'). If the value could be None, use data.get('school') or {} before calling .get() again." },
        { q: "What Python type does a JSON object map to?", a: "A JSON object maps to a Python dictionary (dict)." },
        { q: "What Python type does a JSON array map to?", a: "A JSON array maps to a Python list." },
        { q: "What exception is raised for invalid JSON?", a: "json.JSONDecodeError." },
        { q: "What is the difference between JSON and Python dict syntax?", a: "JSON uses double quotes for keys/strings, lowercase true/false/null, and has no trailing commas. Python dicts use single or double quotes, True/False/None, and allow trailing commas." },
        { q: "How do you add an item to a JSON array loaded into Python?", a: "Since it's a Python list, use .append() — then write back with json.dump()." },
        { q: "Why should you use 'with open()' when working with JSON files?", a: "It automatically closes the file, preventing resource leaks and ensuring data is flushed to disk." }
    ];

    // Rendering logic
    let currentIndex = 0;
    const totalSlides = slides.length;
    const slideArea = document.getElementById('slideArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counterText = document.getElementById('counterText');
    const dotsContainer = document.getElementById('dotsContainer');

    function renderQA() {
        const container = document.getElementById('qa-container');
        if (!container) return;
        container.innerHTML = '';
        qaData.forEach((item, idx) => {
            const qaDiv = document.createElement('div');
            qaDiv.className = 'qa-item';
            qaDiv.innerHTML = `
                <div class="qa-question" data-idx="${idx}" role="button" tabindex="0">
                    <span><strong>${idx+1}.</strong> ${item.q}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="qa-answer" id="answer-${idx}">
                    <p>${item.a}</p>
                </div>
            `;
            container.appendChild(qaDiv);
        });
        document.querySelectorAll('.qa-question').forEach(question => {
            const toggle = function() {
                const idx = this.getAttribute('data-idx');
                const answerDiv = document.getElementById(`answer-${idx}`);
                const icon = this.querySelector('i');
                answerDiv.classList.toggle('show');
                icon.style.transform = answerDiv.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
            };
            question.addEventListener('click', toggle);
            question.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggle.call(question);
                }
            });
        });
    }

    function renderSlide(index) {
        const slide = slides[index];
        const html = `
            <div class="slide-card">
                <div class="slide-title">
                    ${slide.title}
                </div>
                <div class="slide-sub"><i class="fas fa-angle-right"></i> ${slide.subtitle}</div>
                <div class="slide-content">
                    ${slide.content}
                </div>
            </div>
        `;
        slideArea.innerHTML = html;
        // Knowledge check slide detection via title
        if (slide.title.includes('Knowledge Check')) renderQA();
        counterText.innerHTML = `<i class="far fa-file-alt"></i> ${index+1} / ${totalSlides}`;
        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index === totalSlides-1);
        updateDots(index);
        // Scroll to top of slide area
        slideArea.scrollTop = 0;
    }

    function updateDots(activeIndex) {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === activeIndex) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        }
    }

    function nextSlide() { if (currentIndex < totalSlides - 1) { currentIndex++; renderSlide(currentIndex); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(currentIndex); } }
    function handleKeyDown(e) {
        // Ignore arrow keys when typing in inputs/textareas
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    }

    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);
    window.addEventListener('keydown', handleKeyDown);
    renderSlide(0);
</script>
