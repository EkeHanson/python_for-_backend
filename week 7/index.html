        .warning-box i { color: #ef4444; margin-right: 0.5rem; }

        }
        .output-box pre { margin: 0; white-space: pre-wrap; word-break: break-word; }

<script>
    const slides = [
        // SLIDE 0 — Lesson Overview
        {
            title: "<i class='fas fa-chalkboard-user'></i> Lesson Overview",
            subtitle: "Selenium Web Scraping",
            content: `<div class="insight-card"><i class="fas fa-robot"></i> Last lesson, we learned BeautifulSoup. But BeautifulSoup has a critical limitation: it <strong>cannot see content loaded by JavaScript</strong>. Today, we learn Selenium — a tool that controls a real browser and sees the page exactly as a human does.</div>
            <div class="content-grid">
                <div class="concept-box"><h3><i class="fas fa-bullseye"></i> By end of class</h3><ul>
                    <li>✅ Understand what Selenium is and why it exists</li>
                    <li>✅ Compare Selenium vs BeautifulSoup</li>
                    <li>✅ Install Selenium (no manual driver downloads!)</li>
                    <li>✅ Open pages and find elements</li>
                    <li>✅ Wait for dynamic content properly</li>
                    <li>✅ Click buttons and scroll pages</li>
                    <li>✅ Scrape a live JavaScript-rendered page</li>
                </ul></div>
                <div class="concept-box"><h3><i class="fas fa-road"></i> Topics Covered</h3><ul>
                    <li>What is Selenium?</li>
                    <li>Selenium vs BeautifulSoup</li>
                    <li>Installation &amp; Selenium Manager</li>
                    <li>Opening pages &amp; extracting elements</li>
                    <li>Explicit waits (WebDriverWait)</li>
                    <li>User interactions (click, scroll)</li>
                    <li>Headless mode</li>
                    <li>Real-world scraping example</li>
                    <li>Best practices &amp; pitfalls</li>
                </ul></div>
            </div>`
        },
        // SLIDE 1 — What is Selenium?
        {
            title: "<i class='fas fa-robot'></i> What is Selenium?",
            subtitle: "Browser automation — the tool that sees what you see",
            content: `<div class="content-grid">
                <div class="concept-box"><h3><i class="fas fa-lightbulb"></i> Definition</h3>
                <p>Selenium is a <span class="highlight">browser automation framework</span>. It controls a real browser (Chrome, Firefox, Edge) programmatically — opening pages, clicking buttons, scrolling, and extracting content <strong>after JavaScript has run</strong>.</p></div>
                <div class="concept-box"><h3><i class="fas fa-history"></i> Origin</h3>
                <p>Originally built for <strong>automated testing</strong> of web applications. Developers use it to click through apps and verify they work. Scrapers borrow it for the same power: controlling a real browser.</p></div>
            </div>
            <div class="insight-card"><i class="fas fa-check-circle"></i> <strong>Key insight:</strong> Selenium doesn't fetch HTML. It <strong>launches a browser</strong>, lets the page fully load (including JavaScript), and then reads the rendered DOM. This is why it can see content that <span class="inline-code">requests</span> cannot.</div>`
        },
        // SLIDE 2 — Selenium vs BeautifulSoup
        {
            title: "<i class='fas fa-balance-scale'></i> Selenium vs BeautifulSoup",
            subtitle: "When to use which tool",
            content: `<div class="comparison-table">
                <table style="width:100%">
                    <tr><th>Feature</th><th>BeautifulSoup</th><th>Selenium</th></tr>
                    <tr><td>JavaScript support</td><td><span class="pill red">No</span></td><td><span class="pill green">Yes</span></td></tr>
                    <tr><td>Speed</td><td><span class="pill green">Fast</span></td><td><span class="pill red">Slow</span></td></tr>
                    <tr><td>Resource usage</td><td><span class="pill green">Low</span></td><td><span class="pill red">High</span></td></tr>
                    <tr><td>Setup complexity</td><td><span class="pill green">Simple</span></td><td><span class="pill blue">Moderate</span></td></tr>
                    <tr><td>Browser interaction</td><td><span class="pill red">None</span></td><td><span class="pill green">Full</span></td></tr>
                    <tr><td>Best for</td><td>Static HTML pages</td><td>Dynamic JS pages</td></tr>
                </table>
            </div>
            <div class="two-column-split">
                <div class="concept-box"><h3><i class="fas fa-check-circle"></i> Use BeautifulSoup when…</h3>
                <ul><li>The page is server-rendered (plain HTML)</li><li>You need speed and low resource usage</li><li>No clicks or scrolling required</li><li>Content is in <span class="inline-code">response.text</span></li></ul></div>
                <div class="concept-box"><h3><i class="fas fa-robot"></i> Use Selenium when…</h3>
                <ul><li>Content loads via JavaScript (React, Vue, Angular)</li><li>You need to click, scroll, or fill forms</li><li>Data appears only after interaction</li><li>You need the fully rendered DOM</li></ul></div>
            </div>
            <div class="tip-box"><i class="fas fa-lightbulb"></i> <strong>Golden rule:</strong> Always try <span class="inline-code">requests + BeautifulSoup</span> first. Only reach for Selenium when the data is genuinely hidden by JavaScript.</div>`
        },
        // SLIDE 3 — Installation
        {
            title: "<i class='fas fa-download'></i> Installing Selenium",
            subtitle: "Easier than ever — no manual driver downloads",
            content: `<div class="code-block"><pre><span style="color:#7aa9ff;"># Install Selenium</span>
pip install selenium</pre></div>
            <div class="concept-box"><h3><i class="fas fa-magic"></i> Selenium Manager (v4.6+)</h3>
            <p>In older versions, you had to manually download <span class="inline-code">chromedriver.exe</span> and match it to your Chrome version. <span class="highlight">You no longer need to do this.</span> Modern Selenium includes <strong>Selenium Manager</strong>, which automatically detects your browser and downloads the correct driver.</p></div>
            <div class="code-block"><pre><span style="color:#7aa9ff;"># Verify installation</span>
<span style="color:#fbbf24;">from</span> selenium <span style="color:#fbbf24;">import</span> webdriver

driver = webdriver.Chrome()  <span style="color:#7aa9ff;"># Selenium Manager handles the driver</span>
driver.get(<span style="color:#86efac;">"https://example.com"</span>)
<span style="color:#fbbf24;">print</span>(driver.title)
driver.quit()</pre></div>
            <div class="warning-box"><i class="fas fa-exclamation-triangle"></i> <strong>If it fails:</strong> Make sure Chrome (or Firefox) is installed on your system. Selenium Manager needs an actual browser to drive.</div>`
        },
        // SLIDE 4 — The Basic Pattern
        {
            title: "<i class='fas fa-list-ol'></i> The Basic Selenium Pattern",
            subtitle: "Open, find, extract, close",
            content: `<div class="content-grid" style="flex-direction:column;">
                <div class="concept-box"><h3><span class="step-badge">1</span> Launch the browser</h3>
                <div class="code-block"><pre><span style="color:#fbbf24;">from</span> selenium <span style="color:#fbbf24;">import</span> webdriver

driver = webdriver.Chrome()</pre></div></div>
                <div class="concept-box"><h3><span class="step-badge">2</span> Open the page</h3>
                <div class="code-block"><pre>driver.get(<span style="color:#86efac;">"https://example.com"</span>)</pre></div></div>
                <div class="concept-box"><h3><span class="step-badge">3</span> Find elements</h3>
                <div class="code-block"><pre><span style="color:#fbbf24;">from</span> selenium.webdriver.common.by <span style="color:#fbbf24;">import</span> By

element = driver.find_element(By.CSS_SELECTOR, <span style="color:#86efac;">"h1"</span>)
<span style="color:#fbbf24;">print</span>(element.text)</pre></div></div>
                <div class="concept-box"><h3><span class="step-badge">4</span> Close the browser</h3>
                <div class="code-block"><pre>driver.quit()  <span style="color:#7aa9ff;"># always close!</span></pre></div></div>
            </div>
            <div class="warning-box"><i class="fas fa-exclamation-triangle"></i> <strong>Never forget <span class="inline-code">driver.quit()</span></strong> — otherwise browser processes stay running in the background and consume memory.</div>`
        },
        // SLIDE 5 — Finding Elements
        {
            title: "<i class='fas fa-search'></i> Finding Elements in Selenium",
            subtitle: "By.ID, By.CLASS_NAME, By.CSS_SELECTOR, By.XPATH",
            content: `<div class="code-block"><pre><span style="color:#fbbf24;">from</span> selenium.webdriver.common.by <span style="color:#fbbf24;">import</span> By

<span style="color:#7aa9ff;"># Find ONE element (returns WebElement or raises exception)</span>
el = driver.find_element(By.ID, <span style="color:#86efac;">"main-title"</span>)
el = driver.find_element(By.CLASS_NAME, <span style="color:#86efac;">"content-box"</span>)
el = driver.find_element(By.CSS_SELECTOR, <span style="color:#86efac;">"div.content-box h5"</span>)
el = driver.find_element(By.XPATH, <span style="color:#86efac;">"//h5[text()='Dedicated Team']"</span>)

<span style="color:#7aa9ff;"># Find MANY elements (returns a list)</span>
elements = driver.find_elements(By.CLASS_NAME, <span style="color:#86efac;">"content-box"</span>)
<span style="color:#fbbf24;">for</span> el <span style="color:#fbbf24;">in</span> elements:
    <span style="color:#fbbf24;">print</span>(el.text)</pre></div>
            <div class="comparison-table">
                <table style="width:100%">
                    <tr><th>Locator</th><th>Use when</th><th>Example</th></tr>
                    <tr><td><span class="inline-code">By.ID</span></td><td>Element has unique ID</td><td><span class="inline-code">By.ID, "firstHeading"</span></td></tr>
                    <tr><td><span class="inline-code">By.CLASS_NAME</span></td><td>Multiple elements share class</td><td><span class="inline-code">By.CLASS_NAME, "content-box"</span></td></tr>
                    <tr><td><span class="inline-code">By.CSS_SELECTOR</span></td><td>Precise, flexible matching</td><td><span class="inline-code">By.CSS_SELECTOR, "div.box > h5"</span></td></tr>
                    <tr><td><span class="inline-code">By.XPATH</span></td><td>Complex traversal or text matching</td><td><span class="inline-code">By.XPATH, "//h5[text()='Team']"</span></td></tr>
                </table>
            </div>
            <div class="tip-box"><i class="fas fa-lightbulb"></i> <strong>Difference from BeautifulSoup:</strong> Selenium raises <span class="inline-code">NoSuchElementException</span> if <span class="inline-code">find_element</span> fails — it does NOT return <span class="inline-code">None</span> like BeautifulSoup's <span class="inline-code">find()</span>.</div>`
        },
        // SLIDE 6 — Waiting for Dynamic Content
        {
            title: "<i class='fas fa-clock'></i> Waiting for Dynamic Content",
            subtitle: "The most important Selenium skill",
            content: `<div class="insight-card"><i class="fas fa-exclamation-triangle"></i> <strong>The #1 mistake:</strong> Trying to extract elements immediately after <span class="inline-code">driver.get()</span>. JavaScript content may not be loaded yet → <span class="inline-code">NoSuchElementException</span>.</div>
            <div class="two-column-split">
                <div class="concept-box"><h3><i class="fas fa-times-circle"></i> Bad: time.sleep()</h3>
                <div class="code-block"><pre><span style="color:#fbbf24;">import</span> time

driver.get(url)
time.sleep(<span style="color:#fbbf24;">5</span>)  <span style="color:#7aa9ff;"># always waits 5s,</span>
<span style="color:#7aa9ff;"># even if content loaded in 0.5s</span></pre></div>
                <p>Wastes time. Still fails if content takes longer than 5s.</p></div>
                <div class="concept-box"><h3><i class="fas fa-check-circle"></i> Good: WebDriverWait</h3>
                <div class="code-block"><pre><span style="color:#fbbf24;">from</span> selenium.webdriver.support.ui <span style="color:#fbbf24;">import</span> WebDriverWait
<span style="color:#fbbf24;">from</span> selenium.webdriver.support <span style="color:#fbbf24;">import</span> expected_conditions <span style="color:#fbbf24;">as</span> EC

wait = WebDriverWait(driver, <span style="color:#fbbf24;">10</span>)
element = wait.until(
    EC.presence_of_element_located((By.CSS_SELECTOR, <span style="color:#86efac;">".product-list"</span>))
)</pre></div>
                <p>Waits up to 10s. Proceeds immediately when the element appears.</p></div>
            </div>
            <div class="code-block"><pre><span style="color:#7aa9ff;"># Common expected_conditions</span>
EC.presence_of_element_located((By.ID, <span style="color:#86efac;">"results"</span>))   <span style="color:#7aa9ff;"># element exists in DOM</span>
EC.visibility_of_element_located((By.ID, <span style="color:#86efac;">"results"</span>)) <span style="color:#7aa9ff;"># element is visible</span>
EC.element_to_be_clickable((By.ID, <span style="color:#86efac;">"submit"</span>))      <span style="color:#7aa9ff;"># element is clickable</span>
EC.title_contains(<span style="color:#86efac;">"Dashboard"</span>)                        <span style="color:#7aa9ff;"># page title changed</span></pre></div>
            <div class="tip-box"><i class="fas fa-star"></i> <strong>Best practice:</strong> Always use <span class="inline-code">WebDriverWait</span> with <span class="inline-code">expected_conditions</span>. Never use <span class="inline-code">time.sleep()</span> in production scrapers.</div>`
        },
        // SLIDE 7 — User Interactions
        {
            title: "<i class='fas fa-mouse-pointer'></i> User Interactions",
            subtitle: "Clicking, typing, and scrolling",
            content: `<div class="content-grid">
                <div class="concept-box"><h3><i class="fas fa-hand-pointer"></i> Click</h3>

    const prevBtn = document.getElementById('prevBtn');

    const counterText = document.getElementById('counterText');
    const dotsContainer = document.getElementById('dotsContainer');

    function renderQA(containerId, qaData) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        qaData.forEach((item, idx) => {
            const qaDiv = document.createElement('div');
            qaDiv.className = 'qa-item';
            qaDiv.innerHTML = `
                <div class="qa-question" data-idx="${idx}">
                    <span><strong>${idx+1}.</strong> ${item.q}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="qa-answer" id="answer-${containerId}-${idx}">
                    <p>${item.a}</p>
                </div>
            `;
            container.appendChild(qaDiv);
        });
        document.querySelectorAll(`#${containerId} .qa-question`).forEach(question => {
            question.addEventListener('click', function() {
                const idx = this.getAttribute('data-idx');
                const answerDiv = document.getElementById(`answer-${containerId}-${idx}`);
                const icon = this.querySelector('i');
                answerDiv.classList.toggle('show');
                icon.style.transform = answerDiv.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
            });
        });
    }

    function renderSlide(index) {
        const slide = slides[index];
        const html = `
            <div class="slide-card">
                <div class="slide-title">${slide.title}</div>
                <div class="slide-sub"><i class="fas fa-angle-right"></i> ${slide.subtitle}</div>
                <div class="slide-content">${slide.content}</div>
            </div>
        `;
        slideArea.innerHTML = html;

        if (index === 13) {
            renderQA('qa-container', qaData);
        }

        counterText.innerHTML = `<i class="far fa-file-alt"></i> ${index+1} / ${totalSlides}`;
        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index === totalSlides-1);
        updateDots(index);
    }

    function updateDots(activeIndex) {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === activeIndex) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        }
    }
    function nextSlide() { if (currentIndex < totalSlides - 1) { currentIndex++; renderSlide(currentIndex); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(currentIndex); } }
    function handleKeyDown(e) {
        if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    }

    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);
    window.addEventListener('keydown', handleKeyDown);
    renderSlide(0);
</script>
