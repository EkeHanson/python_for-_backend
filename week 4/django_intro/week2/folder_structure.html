                    <i class="fas fa-file-code"></i> │       └── index.html<br>
                    <i class="fas fa-file-code"></i> └── urls.py         <span style="color:#7ecfdf;">← App-specific URLs</span>
                </div>
                <div class="insight-card"><i class="fas fa-folder-open"></i> <strong>Tip:</strong> Keep each app focused — one app per feature (auth, blog, shop).</div>
            `
        },
        {
            title: "<i class='fas fa-question-circle'></i> Knowledge Check — Django Files",
            subtitle: "Test your understanding",
            content: `
                <div class="qa-section">
                    <div class="qa-title"><i class="fas fa-question-circle"></i> Click to reveal answers</div>
                    <div id="qa-container"></div>
                </div>
                <div class="insight-card"><i class="fas fa-graduation-cap"></i> <strong>Review:</strong> These questions consolidate your knowledge of the Django file structure.</div>
            `
        },
        {
            title: "<i class='fas fa-check-circle'></i> Quick Summary",
            subtitle: "Every file's role in one view",
            content: `
                <div class="two-column-split">
                    <div class="col"><h4><i class="fas fa-file-alt"></i> Project Root</h4>
                        <ul style="margin-left:1.2rem;">
                            <li><span class="highlight">manage.py</span> — CLI entry point</li>
                            <li><span class="highlight">myproject/</span> — main package</li>
                        </ul>
                        <h4 style="margin-top:0.8rem;"><i class="fas fa-cog"></i> Inside myproject/</h4>
                        <ul style="margin-left:1.2rem;">
                            <li><span class="highlight">__init__.py</span> — package marker</li>
                            <li><span class="highlight">settings.py</span> — all config</li>
                            <li><span class="highlight">urls.py</span> — URL routing</li>
                            <li><span class="highlight">wsgi.py</span> — production entry</li>
                            <li><span class="highlight">asgi.py</span> — async entry</li>
                        </ul>
                    </div>
                    <div class="col"><h4><i class="fas fa-puzzle-piece"></i> App Files</h4>
                        <ul style="margin-left:1.2rem;">
                            <li><span class="highlight">models.py</span> — database tables</li>
                            <li><span class="highlight">views.py</span> — business logic</li>
                            <li><span class="highlight">urls.py</span> — app routes</li>
                            <li><span class="highlight">admin.py</span> — admin interface</li>
                            <li><span class="highlight">apps.py</span> — app config</li>
                            <li><span class="highlight">migrations/</span> — schema changes</li>
                            <li><span class="highlight">templates/</span> — HTML files</li>
                        </ul>
                    </div>
                </div>
                <div class="insight-card"><i class="fas fa-thumbs-up"></i> <strong>You now know:</strong> The purpose of every core file in a Django project!</div>
            `
        }
    ];

    const qaData = [
        { q: "What is the purpose of manage.py in a Django project?", a: "manage.py is a command-line utility that lets you interact with your Django project. It runs the development server, creates apps, applies migrations, and more." },
        { q: "What does settings.py contain?", a: "settings.py holds all project configuration: SECRET_KEY, DEBUG, ALLOWED_HOSTS, INSTALLED_APPS, DATABASES, TEMPLATES, middleware, and static/media settings." },
        { q: "What is the difference between wsgi.py and asgi.py?", a: "wsgi.py is the entry point for synchronous WSGI servers (like Gunicorn) used in production. asgi.py is for asynchronous ASGI servers, used for WebSockets, async views, and Django Channels." },
        { q: "What is the purpose of __init__.py in Django folders?", a: "__init__.py marks a directory as a Python package so it can be imported. In Django, it's also used for app configuration (AppConfig) in some cases." },
        { q: "Where are URL routes defined in Django?", a: "URL routes are defined in urls.py files. The project's main urls.py includes app-specific urls.py files using include()." },
        { q: "What files are typically inside a Django app?", a: "An app contains __init__.py, admin.py, apps.py, models.py, views.py, migrations/, templates/, and often urls.py. These handle models, views, admin, and URL routing for that app." },
        { q: "Why is DEBUG set to False in production?", a: "When DEBUG=True, Django shows detailed error pages with tracebacks and sensitive settings. This is a security risk and should never be enabled on a live site." },
        { q: "What is the role of migrations/ folder?", a: "migrations/ stores database schema change files generated by makemigrations. They are applied to the database using migrate and track changes to models." },
        { q: "What does the 'include()' function do in urls.py?", a: "include() allows you to reference other URLconfs (urls.py files) from apps, making URL routing modular and clean." },
        { q: "What is the DJANGO_SETTINGS_MODULE environment variable?", a: "It tells Django which settings module to use. It's set by manage.py and wsgi.py to point to your project's settings.py file." }
    ];

    let currentIndex = 0;
    const totalSlides = slides.length;

    const slideArea = document.getElementById('slideArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counterText = document.getElementById('counterText');
    const dotsContainer = document.getElementById('dotsContainer');

    function renderQA() {
        const container = document.getElementById('qa-container');
        if (!container) return;
        container.innerHTML = '';
        qaData.forEach((item, idx) => {
            const qaDiv = document.createElement('div');
            qaDiv.className = 'qa-item';
            qaDiv.innerHTML = `
                <div class="qa-question" data-idx="${idx}">
                    <span><strong>${idx+1}.</strong> ${item.q}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="qa-answer" id="answer-${idx}">
                    <p>${item.a}</p>
                </div>
            `;
            container.appendChild(qaDiv);
        });
        document.querySelectorAll('.qa-question').forEach(question => {
            question.addEventListener('click', function() {
                const idx = this.getAttribute('data-idx');
                const answerDiv = document.getElementById(`answer-${idx}`);
                const icon = this.querySelector('i');
                answerDiv.classList.toggle('show');
                icon.style.transform = answerDiv.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
            });
        });
    }

    function renderSlide(index) {
        const slide = slides[index];
        const html = `
            <div class="slide-card">
                <div class="slide-title">
                    ${slide.title}
                </div>
                <div class="slide-sub"><i class="fas fa-angle-right"></i> ${slide.subtitle}</div>
                <div class="slide-content">
                    ${slide.content}
                </div>
            </div>
        `;
        slideArea.innerHTML = html;
        if (index === 8) renderQA(); // slide with QA
        counterText.innerHTML = `<i class="far fa-file-alt"></i> ${index+1} / ${totalSlides}`;
        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index === totalSlides-1);
        updateDots(index);
    }

    function updateDots(activeIndex) {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === activeIndex) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        }
    }

    function nextSlide() { if (currentIndex < totalSlides - 1) { currentIndex++; renderSlide(currentIndex); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(currentIndex); } }
    function handleKeyDown(e) {
        if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    }

    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);
    window.addEventListener('keydown', handleKeyDown);
    renderSlide(0);
</script>
</body>
</html>
