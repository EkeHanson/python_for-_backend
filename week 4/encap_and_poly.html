<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OOP · Encapsulation & Polymorphism</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f4f8;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .slide-deck {
            max-width: 1200px;
            width: 100%;
            background: #ffffff;
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .progress-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .progress-track {
            flex: 1;
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        .slide-counter {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 600;
        }
        .slide-content {
            min-height: 400px;
            padding: 0.5rem 0;
        }
        .slide-tag {
            display: inline-block;
            background: #e2e8f0;
            color: #475569;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            margin-bottom: 1rem;
        }
        .slide-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            color: #0f172a;
        }
        .slide-title i {
            color: #3b82f6;
            margin-right: 0.6rem;
        }
        .slide-desc {
            font-size: 1.05rem;
            color: #334155;
            line-height: 1.7;
            margin-bottom: 1rem;
        }
        .code-block {
            background: #1e293b;
            border-radius: 0.8rem;
            padding: 1rem 1.2rem;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: #e2e8f0;
            overflow-x: auto;
            margin: 0.75rem 0 0.5rem;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
        }
        .code-block .c { color: #94a3b8; }
        .code-block .k { color: #60a5fa; }
        .code-block .s { color: #34d399; }
        .code-block .f { color: #fbbf24; }
        .code-block .n { color: #a78bfa; }
        .pillar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }
        .pillar-card {
            background: #f8fafc;
            border-radius: 1rem;
            padding: 1.2rem;
            border: 1px solid #e2e8f0;
        }
        .pillar-card .icon {
            font-size: 1.5rem;
            color: #3b82f6;
            margin-bottom: 0.3rem;
        }
        .pillar-card h4 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
        }
        .pillar-card p {
            font-size: 0.85rem;
            color: #475569;
        }
        .feature-list {
            list-style: none;
            padding: 0;
            margin: 0.5rem 0;
        }
        .feature-list li {
            padding: 0.25rem 0;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .feature-list li i {
            color: #3b82f6;
            width: 20px;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .nav-btn {
            background: transparent;
            border: 2px solid #e2e8f0;
            color: #475569;
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .nav-btn:hover { border-color: #3b82f6; color: #0f172a; background: #f8fafc; }
        .nav-btn.primary {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #ffffff;
        }
        .nav-btn.primary:hover { background: #2563eb; border-color: #2563eb; }
        .nav-btn:disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        .dot-indicators {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .dot {
            width: 10px;
            height: 10px;

        }

            margin-top: 0.8rem;

        }

        }

            grid-template-columns: 1fr 1fr;

        }
        .comparison-box {

        }

        }
        .comparison-box h5 i {

        }
        .comparison-box ul {

        }
        .comparison-box ul li {

            background: #fef2f2;
            border-left: 4px solid #ef4444;
            border-radius: 0.6rem;
            padding: 0.8rem 1rem;
            margin: 0.75rem 0;
            font-size: 0.9rem;
            color: #991b1b;
        }
        .warning-box i {
            color: #ef4444;
            margin-right: 0.5rem;
        }
        .success-box {
            background: #f0fdf4;

            margin: 0.75rem 0;

        .success-box i {

            margin-right: 0.5rem;

            .slide-title { font-size: 1.6rem; }
            .slide-desc { font-size: 0.95rem; }

        }
    </style>
</head>

        ],
        code: '# Without polymorphism — messy\nfor item in items:\n    if item.type == "circle":\n        print(3.14 * item.r ** 2)\n    elif item.type == "square":\n        print(item.side ** 2)\n    elif item.type == "triangle":\n        print(0.5 * item.b * item.h)\n\n# With polymorphism — clean\nfor shape in shapes:\n    print(shape.area())'

var currentIndex = 0;
var totalSlides = slides.length;

function highlightPythonCode(code) {
    var lines = code.split('\n');
    var result = [];
    for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var processed = line;
        // Comments
        processed = processed.replace(/^( +)?(#.*)$/, function(match, spaces, comment) {
            return (spaces || '') + '<span class="c">' + comment + '</span>';
        });
        // Keywords
        processed = processed.replace(/\b(class|def|if|else|elif|for|while|return|import|from|pass|super|print|and|or|not|in|is|lambda|yield|with|as|try|except|finally|raise|assert|True|False|None|self)\b/g, 
            '<span class="k">$1</span>');
        // Strings - double quotes
        processed = processed.replace(/"(.*?)"/g, '<span class="s">"$1"</span>');
        // Strings - single quotes
        processed = processed.replace(/'(.*?)'/g, '<span class="s">\'$1\'</span>');
        result.push(processed);
    }
    return result.join('\n');
}

function renderSlide(index) {
    var slide = slides[index];
    var contentDiv = document.getElementById('slideContent');
    var progressFill = document.getElementById('progressFill');
    var counterSpan = document.getElementById('slideCounter');
    
    var html = '';
    html += '<div class="slide-tag">' + slide.tag + '</div>';
    
    var title = slide.title;
    if (slide.icon) {
        title = '<i class="fas ' + slide.icon + '"></i> ' + slide.title;
    }
    html += '<div class="slide-title">' + title + '</div>';
    html += '<div class="slide-desc">' + slide.desc + '</div>';
    
    if (slide.features && slide.features.length > 0) {
        html += '<ul class="feature-list">';
        for (var f = 0; f < slide.features.length; f++) {
            html += '<li><i class="fas fa-check-circle"></i> ' + slide.features[f] + '</li>';
        }
        html += '</ul>';
    }
    
    if (slide.type === 'comparison' && slide.comparisons) {
        html += '<div class="comparison-grid">';
        for (var c = 0; c < slide.comparisons.length; c++) {
            var comp = slide.comparisons[c];
            html += '<div class="comparison-box">';
            html += '<h5><i class="fas ' + comp.icon + '"></i> ' + comp.title + '</h5>';
            html += '<ul>';
            for (var p = 0; p < comp.points.length; p++) {
                html += '<li>' + comp.points[p] + '</li>';
            }
            html += '</ul></div>';
        }
        html += '</div>';
    }
    
    if (slide.type === 'grid' && slide.items) {
        html += '<div class="pillar-grid">';
        for (var g = 0; g < slide.items.length; g++) {
            var item = slide.items[g];
            html += '<div class="pillar-card">';
            html += '<div class="icon"><i class="fas ' + item.icon + '"></i></div>';
            html += '<h4>' + item.label + '</h4>';
            html += '<p>' + item.desc + '</p>';
            html += '</div>';
        }
        html += '</div>';
    }
    
    if (slide.code) {
        var highlighted = highlightPythonCode(slide.code);
        html += '<div class="code-block">' + highlighted + '</div>';
    }
    
    if (slide.extra) {
        html += '<div class="extra-text"><i class="fas fa-check-circle"></i> ' + slide.extra + '</div>';
    }
    
    contentDiv.innerHTML = html;
    
    var progress = ((index + 1) / totalSlides) * 100;
    progressFill.style.width = progress + '%';
    counterSpan.textContent = (index + 1) + ' / ' + totalSlides;
    
    var dots = document.querySelectorAll('.dot');
    for (var d = 0; d < dots.length; d++) {
        dots[d].className = 'dot' + (d === index ? ' active' : '');
    }
    
    document.getElementById('prevBtn').disabled = (index === 0);
    document.getElementById('nextBtn').disabled = (index === totalSlides - 1);
    var nextBtn = document.getElementById('nextBtn');
    if (index === totalSlides - 1) {
        nextBtn.innerHTML = 'Done <i class="fas fa-check"></i>';
    } else {
        nextBtn.innerHTML = 'Next <i class="fas fa-arrow-right"></i>';
    }
    
    currentIndex = index;
}

function goToSlide(index) {
    if (index < 0) index = 0;
    if (index >= totalSlides) index = totalSlides - 1;
    renderSlide(index);
}

function nextSlide() {
    if (currentIndex < totalSlides - 1) goToSlide(currentIndex + 1);
}

function prevSlide() {
    if (currentIndex > 0) goToSlide(currentIndex - 1);
}

function initDots() {
    var container = document.getElementById('dotContainer');
    container.innerHTML = '';
    for (var i = 0; i < totalSlides; i++) {
        var dot = document.createElement('span');
        dot.className = 'dot' + (i === 0 ? ' active' : '');
        dot.onclick = (function(idx) {
            return function() { goToSlide(idx); };
        })(i);
        container.appendChild(dot);
    }
}

document.getElementById('prevBtn').onclick = prevSlide;
document.getElementById('nextBtn').onclick = nextSlide;

document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
    }
    if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
    }
});

initDots();
renderSlide(0);
</script>
</body>
</html>
