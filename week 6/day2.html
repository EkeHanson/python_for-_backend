    const slides = [
        // SLIDE 0 — Lesson Overview
        {
            title: "<i class='fas fa-chalkboard-user'></i> Lesson Overview",

            content: `<div class="insight-card"><i class="fas fa-spider"></i> Today we learn to extract data from websites programmatically. This is one of the most practical skills in Python — used for research, price monitoring, data journalism, and building datasets for AI/ML models.</div>
            <div class="content-grid">

                    <li>Navigating the Parse Tree</li>
                    <li>Real-World Scraper Project</li>
                </ul></div>
            </div>`
        },
        // SLIDE 1 — What is Web Scraping?
        {
            title: "<i class='fas fa-spider'></i> What is Web Scraping?",
            subtitle: "Extracting data from websites automatically",
            content: `<div class="content-grid">
                <div class="concept-box"><h3><i class="fas fa-lightbulb"></i> Definition</h3>
                <p>Web scraping is the process of <span class="highlight">automatically extracting data from websites</span>. Instead of copying and pasting information manually, you write a program that does it for you.</p></div>
                <div class="concept-box"><h3><i class="fas fa-utensils"></i> Analogy</h3>
                <p>Imagine you need the prices of 1,000 products from an online store. Copying each one manually would take days. A web scraper does it in minutes.</p></div>
            </div>
            <div class="insight-card"><i class="fas fa-check-circle"></i> <strong>Real-world uses:</strong> Price comparison, job listing aggregation, news monitoring, sentiment analysis, academic research, and building datasets for machine learning.</div>`
        },
        // SLIDE 2 — Ethics & Legal
        {
            title: "<i class='fas fa-balance-scale'></i> Ethics & Legal Considerations",
            subtitle: "Scrape responsibly — this is not optional",
            content: `<div class="warning-box"><i class="fas fa-exclamation-triangle"></i> <strong>Before scraping any website, always check:</strong>
            <ul style="margin-top:0.6rem; margin-left:1.2rem; color:#e2e8f0; line-height:1.6;">
                <li>1. <strong>robots.txt</strong> — e.g., <span class="inline-code">https://en.wikipedia.org/robots.txt</span></li>
                <li>2. <strong>Terms of Service</strong> — some sites explicitly prohibit scraping</li>
                <li>3. <strong>Rate limits</strong> — don't hammer the server with requests</li>
                <li>4. <strong>Personal data</strong> — GDPR and privacy laws apply</li>
            </ul></div>
            <div class="content-grid">
                <div class="concept-box"><h3><i class="fas fa-check-circle"></i> Best Practices</h3><ul>
                    <li>✅ Set a descriptive User-Agent</li>
                    <li>✅ Add delays between requests</li>
                    <li>✅ Cache pages during development</li>
                    <li>✅ Prefer official APIs when available</li>
                    <li>✅ Respect copyright and licenses</li>
                </ul></div>
                <div class="concept-box"><h3><i class="fas fa-code"></i> Good User-Agent</h3>
                <div class="code-block"><pre>headers = {
    "User-Agent": "MyTeachingBot/1.0 (educational)"
}</pre></div>
                <p>This tells the server who you are and why you're scraping.</p></div>
            </div>
            <div class="tip-box"><i class="fas fa-info-circle"></i> <strong>Wikipedia</strong> is a great site to practice on — it's open, well-structured, and allows scraping with proper attribution (CC BY-SA 4.0).</div>`
        },
        // SLIDE 3 — HTML Structure Review
        {
            title: "<i class='fas fa-code'></i> HTML Structure Review",
            subtitle: "Understanding the DOM before you scrape",
            content: `<div class="code-block"><pre>&lt;!DOCTYPE html&gt;
&lt;html&gt;
  &lt;head&gt;
    &lt;title&gt;My Page&lt;/title&gt;
  &lt;/head&gt;
  &lt;body&gt;
    &lt;h1 id="main-title"&gt;Welcome&lt;/h1&gt;
    &lt;div class="content"&gt;
      &lt;p class="intro"&gt;Hello, world!&lt;/p&gt;
      &lt;a href="https://example.com"&gt;Visit&lt;/a&gt;
    &lt;/div&gt;
  &lt;/body&gt;
&lt;/html&gt;</pre></div>
            <div class="comparison-table">
                <table style="width:100%">
                    <tr><th>Term</th><th>Meaning</th><th>Example</th></tr>
                    <tr><td><span class="highlight">Tag</span></td><td>Element name</td><td><span class="inline-code">h1</span>, <span class="inline-code">p</span>, <span class="inline-code">div</span></td></tr>
                    <tr><td><span class="highlight">Attribute</span></td><td>Extra info on a tag</td><td><span class="inline-code">class="intro"</span>, <span class="inline-code">id="main"</span></td></tr>
                    <tr><td><span class="highlight">Class</span></td><td>Reusable label (many elements)</td><td><span class="inline-code">class="content"</span></td></tr>
                    <tr><td><span class="highlight">ID</span></td><td>Unique label (one element)</td><td><span class="inline-code">id="main-title"</span></td></tr>
                    <tr><td><span class="highlight">Text</span></td><td>Content between tags</td><td><span class="inline-code">"Hello, world!"</span></td></tr>
                </table>
            </div>
            <div class="tip-box"><i class="fas fa-lightbulb"></i> <strong>Pro tip:</strong> Before scraping, right-click on the page in your browser and choose <strong>"Inspect"</strong> to see the HTML structure. This is your map!</div>`
        },
        // SLIDE 4 — Installing BeautifulSoup
        {
            title: "<i class='fas fa-download'></i> Installing BeautifulSoup",
            subtitle: "Setting up your scraping toolkit",
            content: `<div class="code-block"><pre><span style="color:#7aa9ff;"># Install in your terminal</span>
pip install requests beautifulsoup4

<span style="color:#7aa9ff;"># Optional: better HTML parser (faster, more robust)</span>
pip install lxml</pre></div>
            <div class="content-grid">
                <div class="concept-box"><h3><i class="fas fa-cube"></i> requests</h3>
                <p>Fetches web pages — handles HTTP requests, headers, sessions, and responses.</p></div>
                <div class="concept-box"><h3><i class="fas fa-utensils"></i> BeautifulSoup (bs4)</h3>
                <p>Parses HTML/XML — navigates the parse tree, finds elements, extracts text and attributes.</p></div>
            </div>
            <div class="code-block"><pre><span style="color:#7aa9ff;"># Verify installation</span>
<span style="color:#fbbf24;">import</span> requests
<span style="color:#fbbf24;">from</span> bs4 <span style="color:#fbbf24;">import</span> BeautifulSoup

<span style="color:#fbbf24;">print</span>(<span style="color:#86efac;">"Setup complete!"</span>)</pre></div>

        },
        // SLIDE 5 — The 4-Step Recipe
        {
            title: "<i class='fas fa-list-ol'></i> The 4-Step Scraping Recipe",
            subtitle: "A universal pattern for any scraping task",
            content: `<div class="content-grid" style="flex-direction:column;">
                <div class="concept-box"><h3><span class="step-badge">1</span> Fetch the page</h3>
                <div class="code-block"><pre><span style="color:#fbbf24;">import</span> requests

url = <span style="color:#86efac;">"https://en.wikipedia.org/wiki/List_of_largest_technology_companies_by_revenue"</span>
response = requests.get(url, headers={<span style="color:#86efac;">"User-Agent"</span>: <span style="color:#86efac;">"MyBot/1.0"</span>})</pre></div></div>
                <div class="concept-box"><h3><span class="step-badge">2</span> Parse the HTML</h3>
                <div class="code-block"><pre><span style="color:#fbbf24;">from</span> bs4 <span style="color:#fbbf24;">import</span> BeautifulSoup

soup = BeautifulSoup(response.text, <span style="color:#86efac;">"html.parser"</span>)</pre></div></div>
                <div class="concept-box"><h3><span class="step-badge">3</span> Find the data</h3>
                <div class="code-block"><pre>tables = soup.find_all(<span style="color:#86efac;">"table"</span>, class_=<span style="color:#86efac;">"wikitable"</span>)
for table in tables:
    rows = table.find_all(<span style="color:#86efac;">"tr"</span>)</pre></div></div>
                <div class="concept-box"><h3><span class="step-badge">4</span> Extract and store</h3>
                <div class="code-block"><pre><span style="color:#fbbf24;">for</span> row <span style="color:#fbbf24;">in</span> rows:

    data = [cell.get_text(strip=<span style="color:#fbbf24;">True</span>) <span style="color:#fbbf24;">for</span> cell <span style="color:#fbbf24;">in</span> cells]</pre></div></div>
            </div>
            <div class="insight-card"><i class="fas fa-key"></i> <strong>Remember this pattern</strong> — it works for almost every scraping task. Fetch → Parse → Find → Extract.</div>`

        {

            subtitle: "find(), find_all(), and CSS selectors",

                <p>Returns the <strong>first</strong> matching element (or <span class="inline-code">None</span>).</p>
                <div class="code-block"><pre>title = soup.find(<span style="color:#86efac;">"h1"</span>)
first_table = soup.find(<span style="color:#86efac;">"table"</span>)</pre></div></div>
                <div class="concept-box"><h3><i class="fas fa-list"></i> find_all()</h3>
                <p>Returns a <strong>list</strong> of all matching elements.</p>
                <div class="code-block"><pre>all_tables = soup.find_all(<span style="color:#86efac;">"table"</span>)
all_links = soup.find_all(<span style="color:#86efac;">"a"</span>)</pre></div></div>
            </div>
            <div class="code-block"><pre><span style="color:#7aa9ff;"># Find by class (note the underscore: class_)</span>
tables = soup.find_all(<span style="color:#86efac;">"table"</span>, class_=<span style="color:#86efac;">"wikitable"</span>)

<span style="color:#7aa9ff;"># Find by ID</span>
header = soup.find(id=<span style="color:#86efac;">"firstHeading"</span>)

<span style="color:#7aa9ff;"># Find by attribute</span>
links = soup.find_all(<span style="color:#86efac;">"a"</span>, href=<span style="color:#fbbf24;">True</span>)</pre></div>
            <div class="warning-box"><i class="fas fa-exclamation-triangle"></i> <strong>Common mistake:</strong> <span class="inline-code">class</span> is a Python keyword — use <span class="inline-code">class_</span> with an underscore in BeautifulSoup!</div>`

    let currentIndex = 0;

    const slideArea = document.getElementById('slideArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counterText = document.getElementById('counterText');
    const dotsContainer = document.getElementById('dotsContainer');

    function renderQA(containerId, qaData) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        qaData.forEach((item, idx) => {
            const qaDiv = document.createElement('div');
            qaDiv.className = 'qa-item';
            qaDiv.innerHTML = `
                <div class="qa-question" data-idx="${idx}">
                    <span><strong>${idx+1}.</strong> ${item.q}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="qa-answer" id="answer-${containerId}-${idx}">
                    <p>${item.a}</p>
                </div>
            `;
            container.appendChild(qaDiv);
        });
        document.querySelectorAll(`#${containerId} .qa-question`).forEach(question => {
            question.addEventListener('click', function() {
                const idx = this.getAttribute('data-idx');
                const answerDiv = document.getElementById(`answer-${containerId}-${idx}`);
                const icon = this.querySelector('i');
                answerDiv.classList.toggle('show');
                icon.style.transform = answerDiv.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
            });
        });
    }

    function renderSlide(index) {
        const slide = slides[index];
        const html = `
            <div class="slide-card">
                <div class="slide-title">${slide.title}</div>
                <div class="slide-sub"><i class="fas fa-angle-right"></i> ${slide.subtitle}</div>
                <div class="slide-content">${slide.content}</div>
            </div>
        `;
        slideArea.innerHTML = html;
        
        // Render Q&A on the Knowledge Check slide (index 14)
        if (index === 14) {
            renderQA('qa-container', qaData);
        }
        
        counterText.innerHTML = `<i class="far fa-file-alt"></i> ${index+1} / ${totalSlides}`;
        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index === totalSlides-1);
        updateDots(index);
    }

    function updateDots(activeIndex) {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === activeIndex) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        }
    }
    function nextSlide() { if (currentIndex < totalSlides - 1) { currentIndex++; renderSlide(currentIndex); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(currentIndex); } }
    function handleKeyDown(e) {
        if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    }

    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);
    window.addEventListener('keydown', handleKeyDown);
    renderSlide(0);
